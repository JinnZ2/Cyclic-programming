[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cyclic-programming"
version = "0.1.0"
description = "An energy-accounting interpreter and a cascade model for when repair stops being worth it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "JinnZ2"}
]
keywords = ["programming-language", "interpreter", "physics", "quantum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
cyclic = "cyclic_interpreter:cli_main"

[tool.pytest.ini_options]
testpaths = ["tests"]
